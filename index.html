      :root {

      html.dark-mode {

        --text: #f1f2f6;
        --text-muted: #9a9ca8;
        --accent: #e07a5f;
        --accent-rgb: 224, 122, 95;
        --accent-hover: #f4a261;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: rgba(0, 0, 0, 0.5);
        --scrollbar-thumb: #e07a5f;
        --scrollbar-track: #181a21;
        --button-bg: rgba(32, 35, 45, 0.85);
        --button-hover: rgba(42, 46, 58, 0.95);
        --icon: #a0a2b0;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; width: 100%; overflow: hidden; }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        position: relative;
        transition: background-color var(--trans), color var(--trans);

      /* Gentle Organic Noise Texture */
      .noise-bg {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0; animation: fadeInCanvas 2s forwards; animation-delay: 0.3s; }
      @keyframes fadeInCanvas { to { opacity: 1; } }

      .container {
        max-width: 900px; width: 90%; padding: 38px 46px;
        background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 24px; z-index: 1;
        opacity: 0; transform: translateY(20px); animation: fadeInUpContent 1s forwards; animation-delay: 0.5s;
        box-shadow: 0 20px 45px -10px var(--shadow), 0 0 25px rgba(var(--accent-rgb), 0.05);
        border: 1px solid var(--border);
        max-height: 90vh; overflow-y: auto; scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        transition: background-color var(--trans), border-color var(--trans), box-shadow var(--trans);
      }
      .container::-webkit-scrollbar { width: 7px; }
      .container::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 4px; transition: background-color var(--trans); }
      .container::-webkit-scrollbar-thumb { background-color: var(--scrollbar-thumb); border-radius: 4px; border: 2px solid var(--scrollbar-track); transition: background-color var(--trans); }
      .container::-webkit-scrollbar-thumb:hover { background-color: var(--accent-hover); }

        footer { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 5px 10px; width: 90%; padding: 5px 8px; }
        footer .separator { display: none; }
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("year").textContent = new Date().getFullYear();

        fetch("https://events.vercount.one/api/v2/log", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: "https://www.prashantgiri360.com.np/" }),
          keepalive: true
        }).then(res => res.json()).then(data => {
          if (data.data && data.data.site_uv !== undefined) {
            document.getElementById("visitor-count").textContent = data.data.site_uv;
          }
        }).catch(() => {
          document.getElementById("visitor-count").textContent = "";
        });

        // Theme Toggle Logic (Default: Light Mode)
        const themeBtn = document.getElementById("theme-toggle-button");
        const html = document.documentElement;
        const applyTheme = (theme) => {
          html.classList.toggle("dark-mode", theme === "dark");
          const metaColor = document.querySelector('meta[name="theme-color"]');
          if (metaColor) {
            metaColor.setAttribute("content", theme === "dark" ? "#121318" : "#f7f5f0");
          }
        };
        const saved = localStorage.getItem("theme_preference");
        let currentTheme = saved || "light";
        applyTheme(currentTheme);

        themeBtn.addEventListener("click", () => {
          themeBtn.classList.add("spinning");
          currentTheme = html.classList.contains("dark-mode") ? "light" : "dark";
          applyTheme(currentTheme);
          localStorage.setItem("theme_preference", currentTheme);
        });
        themeBtn.addEventListener("animationend", () => {
          themeBtn.classList.remove("spinning");
        });

        document.querySelectorAll(".link-section").forEach(section => {
          section.querySelectorAll(".nav-item").forEach((item, i) => {
            item.style.animationDelay = `${0.5 + i * 0.08}s`;
          });
        });

        // Background Particle Engine (Warm Ambient Particles)
        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");
        let particles = [], w, h;
        const mouse = { x: null, y: null, radius: 100 };

        const resize = () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
          mouse.radius = Math.min(w, h) / 7.5;
          initParticles();
        };
        window.addEventListener("resize", resize);
        window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener("mouseout", () => { mouse.x = mouse.y = null; });

        class Particle {
          constructor() {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.size = Math.random() * 2.6 + 1.2;
            this.baseSize = this.size;
            this.vx = (Math.random() - 0.5) * 0.7;
            this.vy = (Math.random() - 0.5) * 0.7;
            this.initialAlpha = Math.random() * 0.45 + 0.2;
            this.hue = 18; // Warm Terracotta Tone
            this.sat = 75;
            this.light = 55;
            this.alpha = this.initialAlpha;
            this.floatOffset = Math.random() * Math.PI * 2;
            this.floatSpeed = Math.random() * 0.004 + 0.002;
          }
          update() {
            this.floatOffset += this.floatSpeed;
            const isDarkMode = html.classList.contains("dark-mode");
            const targetLight = isDarkMode ? 68 : 45;
            const targetAlpha = isDarkMode ? this.initialAlpha : this.initialAlpha * 0.55;

            this.light += (targetLight - this.light) * 0.08;
            this.alpha += (targetAlpha - this.alpha) * 0.08;

            let dx = mouse.x - this.x, dy = mouse.y - this.y;
            let dist = mouse.x === null ? Infinity : Math.hypot(dx, dy);
            let tSize = this.baseSize, fx = 0, fy = 0;

            if (dist < mouse.radius) {
              const prox = 1 - dist / mouse.radius;
              tSize = this.baseSize + prox * 3;
              const angle = Math.atan2(dy, dx);
              fx = -Math.cos(angle) * prox * 0.04;
              fy = -Math.sin(angle) * prox * 0.04;
            }
            this.size += (tSize - this.size) * 0.12;
            this.vx += fx; this.vy += fy;
            this.vx *= 0.96; this.vy *= 0.96;
            this.x += this.vx; this.y += this.vy;
            if (this.x < -this.size) this.x = w + this.size;
            else if (this.x > w + this.size) this.x = -this.size;
            if (this.y < -this.size) this.y = h + this.size;
            else if (this.y > h + this.size) this.y = -this.size;
          }
          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${this.alpha})`;
            ctx.fill();
          }
        }

        function initParticles() {
          particles = [];
          const count = Math.max(60, Math.min(220, Math.floor((w * h) / 20e3)));
          for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function connectParticles() {
          ctx.lineWidth = 0.8;
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const d = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
              if (d < 110) {
                const op = (1 - d / 110) * Math.min(particles[i].alpha, particles[j].alpha) * 0.75;
                if (op > 0.04) {
                  ctx.strokeStyle = `hsla(${particles[i].hue}, ${particles[i].sat}%, ${particles[i].light}%, ${op})`;
                  ctx.beginPath();
                  ctx.moveTo(particles[i].x, particles[i].y);
                  ctx.lineTo(particles[j].x, particles[j].y);
                  ctx.stroke();
                }
              }
            }
          }
        }

        function animateCanvas() {
          ctx.clearRect(0, 0, w, h);
          particles.forEach(p => { p.update(); p.draw(); });
          connectParticles();
          requestAnimationFrame(animateCanvas);
        }

        resize();
        animateCanvas();
      });
    </script>
  </body>
</html>
